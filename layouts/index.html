{{ define "header" }}
<header class="intro-header style-text">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                <div class="site-heading">
                    <h1>{{ .Site.Title }}</h1>
                    <span class="subheading">{{ .Site.Params.slogan }}</span>
                </div>
            </div>
        </div>
    </div>
</header>
{{ end }}

{{ define "main" }}
<article>
  <div class="container">
    <div class="row">
      <div class="
        col-lg-8 col-lg-offset-1
        col-md-8 col-md-offset-1
        col-sm-12 col-xs-12
        post-container">

        <div class="home-intro">
          {{ .Content }}
        </div>

        <div class="home-nav-cards">
          <a class="home-card" href="{{ "/bio/" | relLangURL }}">
            <h3>Bio</h3>
            <p>Background & training</p>
          </a>
          <a class="home-card" href="{{ "/research/" | relLangURL }}">
            <h3>Research</h3>
            <p>Past Projects</p>
          </a>
          <a class="home-card" href="{{ "/papers/" | relLangURL }}">
            <h3>Papers</h3>
            <p>Publications & data</p>
          </a>
        </div>

      </div>
      {{ partial "sidebar.html" . }}
    </div>
  </div>
</article>

<style>
  .home-intro { font-size: 19px; line-height: 1.7; margin-top: 10px; }
  .home-intro p { margin-bottom: 20px; }
  .home-nav-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin: 34px 0 10px;
  }
.home-card {
    display: block;
    padding: 22px 24px;
    border-radius: 6px;
    background: #0085a1;
    color: #fff;
    text-align: center;
    transition: box-shadow .18s ease, transform .18s ease, background .18s ease;
  }
  .home-card:hover {
    text-decoration: none;
    background: #006e86;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
    transform: translateY(-2px);
  }
  .home-card h3 {
    margin: 0 0 8px;
    font-size: 21px;
    letter-spacing: .02em;
    color: #fff;
  }
  .home-card p {
    margin: 0;
    color: rgba(255,255,255,.85);
    font-size: 15px;
    line-height: 1.55;
  }
  @media (max-width: 600px) {
    .home-nav-cards { grid-template-columns: 1fr; }
  }
</style>
{{ end }}
